[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplyjyotish-calculation-engine"
version = "0.1.0"
description = "Deterministic, reusable Vedic/Jyotish calculation library"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SimplyJyotish contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pyswisseph>=2.10.3.2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<4",
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
simplyjyotish = "simplyjyotish_engine.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/simplyjyotish_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["simplyjyotish_engine"]
