name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest --cov=simplyjyotish_engine --cov-report=term-missing
      - run: python -c "from pathlib import Path; assert Path('LICENSE').exists() and Path('NOTICE').exists() and Path('THIRD_PARTY_NOTICES.md').exists()"

